name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/content_builder/uv.lock

      - name: Install Python dependencies from lockfile
        working-directory: tools/content_builder
        run: uv sync --frozen --group dev

      - name: Run Python quality and tests
        working-directory: tools/content_builder
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen pytest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install Flutter dependencies from lockfile
        run: flutter pub get --enforced-lockfile

      - name: Run Dart and Flutter quality checks
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build and verify repository-base artifact
        run: tools/build_web.sh /daily-sentences/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy verified artifact
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
